# Local development environment.
#   docker compose up                          # app on http://localhost:3000
#   docker compose run --rm web bin/rails c     # any command inside the container
#   docker compose run --rm -e RAILS_ENV=test web bin/rake   # run CI checks
name: railtrack

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bin/dev
    ports:
      - "3000:3000"
    environment:
      BINDING: 0.0.0.0
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
      # Linux node_modules, so the macOS ones on the host (esbuild binary) are not used.
      - node_modules:/rails/node_modules
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5455:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 15

volumes:
  bundle:
  node_modules:
  pgdata:
